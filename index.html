<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול לוגיסטיקה</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-2xl">📦</span>
                <h1 class="text-xl font-bold tracking-wide">מערכת ניהול יחידה לוגיסטית</h1>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
        <!-- Navigation Tabs -->
        <nav class="flex border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
            <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn flex-1 py-3 text-center font-medium border-b-2 border-blue-600 text-blue-600 dark:text-blue-400">📋 ניהול מלאי</button>
            <button onclick="switchTab('tasks')" id="tab-tasks" class="tab-btn flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400">⏳ משימות</button>
            <button onclick="switchTab('contacts')" id="tab-contacts" class="tab-btn flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400">📞 ספקים וקשר</button>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- TAB 1: INVENTORY -->
        <section id="sec-inventory" class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3">
                <input type="text" id="inventorySearch" oninput="renderInventory()" placeholder="🔎 חיפוש ציוד/מק״ט..." class="p-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-80">
                <button onclick="openModal('inventoryModal')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg shadow flex items-center justify-center gap-2">
                    <span>+</span> הוספת פריט למלאי
                </button>
            </div>

            <div class="overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700/50 text-gray-500 dark:text-gray-400 text-sm border-b border-gray-200 dark:border-gray-700">
                            <th class="p-3.5">שם פריט</th>
                            <th class="p-3.5">מק"ט / קטגוריה</th>
                            <th class="p-3.5">כמות</th>
                            <th class="p-3.5">מיקום במחסן</th>
                            <th class="p-3.5">סטטוס</th>
                            <th class="p-3.5">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm"></tbody>
                </table>
            </div>
        </section>

        <!-- TAB 2: TASKS -->
        <section id="sec-tasks" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold">משימות לוגיסטיות פתוחות</h2>
                <button onclick="openModal('taskModal')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg shadow">
                    + משימה חדשה
                </button>
            </div>
            <div id="tasksList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- TAB 3: CONTACTS -->
        <section id="sec-contacts" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold">ספר טלפונים וספקים</h2>
                <button onclick="openModal('contactModal')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg shadow">
                    + הוספת איש קשר
                </button>
            </div>
            <div id="contactsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

    </main>

    <!-- MODAL: ADD INVENTORY -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold border-b pb-2 dark:border-gray-700">הוספת פריט למלאי</h3>
            <form id="invForm" onsubmit="saveInventoryItem(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium mb-1">שם הפריט</label>
                    <input type="text" id="invName" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">מק"ט</label>
                        <input type="text" id="invSku" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">כמות</label>
                        <input type="number" id="invQty" required min="0" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">מיקום במחסן</label>
                    <input type="text" id="invLoc" placeholder="מדף A3 / אגף ב'" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">סטטוס תקינות</label>
                    <select id="invStatus" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="תקן">תקן</option>
                        <option value="בתיקון">בתיקון / מעבדה</option>
                        <option value="לא תקן">לא תקן / פסול</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse pt-2">
                    <button type="button" onclick="closeModal('inventoryModal')" class="px-4 py-2 border rounded-lg dark:border-gray-600">ביטול</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD TASK -->
    <div id="taskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold border-b pb-2 dark:border-gray-700">הוספת משימה לוגיסטית</h3>
            <form id="taskForm" onsubmit="saveTaskItem(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium mb-1">תאור המשימה</label>
                    <input type="text" id="taskTitle" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">אחראי ביצוע</label>
                    <input type="text" id="taskAssignee" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">רמת דחיפות</label>
                    <select id="taskPriority" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="רגילה">רגילה</option>
                        <option value="דחופה">דחופה</option>
                        <option value="בהולה">בהולה / קריטית</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse pt-2">
                    <button type="button" onclick="closeModal('taskModal')" class="px-4 py-2 border rounded-lg dark:border-gray-600">ביטול</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD CONTACT -->
    <div id="contactModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold border-b pb-2 dark:border-gray-700">הוספת איש קשר / ספק</h3>
            <form id="contactForm" onsubmit="saveContactItem(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium mb-1">שם מלא / חברה</label>
                    <input type="text" id="contactName" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">תפקיד / תחום אחריות</label>
                    <input type="text" id="contactRole" placeholder="ספק ציוד / טכנאי / מפקד" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">טלפון</label>
                    <input type="tel" id="contactPhone" required class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse pt-2">
                    <button type="button" onclick="closeModal('contactModal')" class="px-4 py-2 border rounded-lg dark:border-gray-600">ביטול</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State Storage Management
        let inventory = JSON.parse(localStorage.getItem('logistics_inv')) || [
            { id: 1, name: 'ערכת עזרה ראשונה', sku: 'MED-01', qty: 12, location: 'אגף א - מדף 2', status: 'תקן' },
            { id: 2, name: 'מכשיר קשר נייד', sku: 'COM-99', qty: 5, location: 'ארון ציוד קשר', status: 'בתיקון' }
        ];
        let tasks = JSON.parse(localStorage.getItem('logistics_tasks')) || [
            { id: 1, title: 'ביקורת תקופתית לציוד כיבוי', assignee: 'ישראל ישראלי', priority: 'דחופה', status: 'פתוחה' }
        ];
        let contacts = JSON.parse(localStorage.getItem('logistics_contacts')) || [
            { id: 1, name: 'חברת ציוד לוגיסטי בע"מ', role: 'ספק ציוד היקפי', phone: '03-5555555' }
        ];

        // Dark Mode Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeIcon.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.textContent = isDark ? '☀️' : '🌙';
        });

        // Navigation Switcher
        function switchTab(tab) {
            ['inventory', 'tasks', 'contacts'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'tab-btn flex-1 py-3 text-center font-medium border-b-2 border-blue-600 text-blue-600 dark:text-blue-400';
                } else {
                    btn.className = 'tab-btn flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400';
                }
            });
        }

        // Modals Logic
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // Render Inventory
        function renderInventory() {
            const query = document.getElementById('inventorySearch').value.toLowerCase();
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            inventory.filter(item => item.name.toLowerCase().includes(query) || item.sku.toLowerCase().includes(query)).forEach(item => {
                const statusColor = item.status === 'תקן' ? 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300' :
                                   item.status === 'בתיקון' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-300' :
                                   'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300';
                list.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
                        <td class="p-3.5 font-medium">${item.name}</td>
                        <td class="p-3.5 text-gray-500 dark:text-gray-400">${item.sku}</td>
                        <td class="p-3.5 font-bold">${item.qty}</td>
                        <td class="p-3.5">${item.location}</td>
                        <td class="p-3.5"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${item.status}</span></td>
                        <td class="p-3.5">
                            <button onclick="deleteInventory(${item.id})" class="text-red-600 hover:text-red-800 text-xs font-medium">מחיקה</button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveInventoryItem(e) {
            e.preventDefault();
            inventory.push({
                id: Date.now(),
                name: document.getElementById('invName').value,
                sku: document.getElementById('invSku').value,
                qty: Number(document.getElementById('invQty').value),
                location: document.getElementById('invLoc').value || 'ללא מיקום',
                status: document.getElementById('invStatus').value
            });
            localStorage.setItem('logistics_inv', JSON.stringify(inventory));
            closeModal('inventoryModal');
            document.getElementById('invForm').reset();
            renderInventory();
        }

        function deleteInventory(id) {
            inventory = inventory.filter(i => i.id !== id);
            localStorage.setItem('logistics_inv', JSON.stringify(inventory));
            renderInventory();
        }

        // Render Tasks
        function renderTasks() {
            const list = document.getElementById('tasksList');
            list.innerHTML = '';
            tasks.forEach(t => {
                list.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-md">${t.title}</h4>
                                <span class="text-xs px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">${t.priority}</span>
                            </div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">אחראי: <span class="font-medium text-gray-800 dark:text-gray-200">${t.assignee}</span></p>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-2 border-t dark:border-gray-700">
                            <span class="text-xs text-gray-400">סטטוס: ${t.status}</span>
                            <button onclick="deleteTask(${t.id})" class="text-xs text-red-500 hover:underline">השלם / מחק</button>
                        </div>
                    </div>
                `;
            });
        }

        function saveTaskItem(e) {
            e.preventDefault();
            tasks.push({
                id: Date.now(),
                title: document.getElementById('taskTitle').value,
                assignee: document.getElementById('taskAssignee').value,
                priority: document.getElementById('taskPriority').value,
                status: 'פתוחה'
            });
            localStorage.setItem('logistics_tasks', JSON.stringify(tasks));
            closeModal('taskModal');
            document.getElementById('taskForm').reset();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('logistics_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // Render Contacts
        function renderContacts() {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            contacts.forEach(c => {
                list.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold">${c.name}</h4>
                            <p class="text-xs text-gray-500 dark:text-gray-400">${c.role}</p>
                            <a href="tel:${c.phone}" class="text-sm text-blue-600 dark:text-blue-400 font-medium block mt-1">📞 ${c.phone}</a>
                        </div>
                        <button onclick="deleteContact(${c.id})" class="text-xs text-red-500 hover:underline">מחיקה</button>
                    </div>
                `;
            });
        }

        function saveContactItem(e) {
            e.preventDefault();
            contacts.push({
                id: Date.now(),
                name: document.getElementById('contactName').value,
                role: document.getElementById('contactRole').value || 'כללי',
                phone: document.getElementById('contactPhone').value
            });
            localStorage.setItem('logistics_contacts', JSON.stringify(contacts));
            closeModal('contactModal');
            document.getElementById('contactForm').reset();
            renderContacts();
        }

        function deleteContact(id) {
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('logistics_contacts', JSON.stringify(contacts));
            renderContacts();
        }

        // Initial Load
        renderInventory();
        renderTasks();
        renderContacts();
    </script>
</body>
</html>
